plugins {
    id 'java'
}

group = 'sharks'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// A separate "bucket" for the AspectJ agent jar. It is not a normal dependency of our code:
// we only need the path to its file to start the tests with -javaagent (see test { } below).
configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    implementation 'com.microsoft.playwright:playwright:1.41.0'

    testImplementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    testImplementation 'org.testng:testng:7.9.0'

    testImplementation 'org.slf4j:slf4j-api:2.0.12'
    testImplementation 'ch.qos.logback:logback-classic:1.5.3'

    testImplementation 'io.qameta.allure:allure-testng:2.25.0'
    testImplementation 'io.qameta.allure:allure-java-commons:2.25.0'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Allure uses this agent to notice our @Step methods.
    // Without it the tests run fine, but the steps never appear in the Allure report.
    agent 'org.aspectj:aspectjweaver:1.9.22'
}

test {
    useTestNG()
    // Start the test JVM with the AspectJ agent attached
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]
}